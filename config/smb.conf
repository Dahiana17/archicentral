[global]
   workgroup = OFICINA
   server string = ArchiCentral
   security = user
   map to guest = never
   server min protocol = SMB2_10
   smb encrypt = desired
   hosts allow = 127. 192.168.56.
   load printers = no
   inherit acls = yes
   recycle:repository = Papelera/%U
   recycle:keeptree = yes
   recycle:versions = yes
   recycle:touch_mtime = yes
   recycle:directory_mode = 2770
   recycle:exclude = *.tmp ~$*
   recycle:exclude_dir = Papelera
   full_audit:prefix = %u|%I|%m|%S
   full_audit:success = connect mkdirat renameat unlinkat openat
   full_audit:failure = connect
   full_audit:facility = LOCAL5
   full_audit:priority = NOTICE


[contabilidad]
   path = /srv/compartido/contabilidad
   valid users = @contabilidad @gerencia
   read list = @gerencia
   write list = @contabilidad
   read only = no
   force group = contabilidad
   create mask = 0660
   directory mask = 2770
   vfs objects = full_audit recycle

